<h2 mat-dialog-title>Save PDB Structure File</h2>
<div mat-dialog-content>
  <p class="dialog-description">
    Enter a name for the PDB structure file to save it to your resources.
  </p>
  
  @if (chains.length > 0) {
    <p class="chains-info">
      <strong>Detected chains:</strong> {{ chains.join(', ') }}
    </p>
  }
  
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>PDB File Name</mat-label>
      <input matInput 
             type="text" 
             formControlName="name" 
             placeholder="e.g., my-protein-structure"
             autocomplete="off">
      @if (form.controls.name.invalid && form.controls.name.touched) {
        <mat-error>File name is required</mat-error>
      }
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid">
    Save
  </button>
</div>
