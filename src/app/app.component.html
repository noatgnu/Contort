<a class="skip-link" href="#main-content">Skip to main content</a>

<mat-drawer-container autosize class="drawer-container">
  <mat-drawer #drawer mode="over" class="drawer-sidenav-content" role="navigation" aria-label="Main navigation">
    <nav style="display: flex; flex-direction: column">
      <a mat-button routerLink="/dashboard" (click)="drawer.toggle()">Dashboard</a>
      <a mat-button routerLink="/consurf-job" (click)="drawer.toggle()">Jobs</a>
      <a mat-button routerLink="/consurf-view" (click)="drawer.toggle()">Visualization</a>
    </nav>
  </mat-drawer>
  <mat-toolbar color="primary" role="banner">
    <button (click)="drawer.toggle()"
            mat-icon-button
            aria-label="Toggle navigation menu"
            [attr.aria-expanded]="drawer.opened">
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
    <span>Contort</span>
    <span class="spacer"></span>
    <div class="toolbar-actions" role="toolbar" aria-label="Application actions">
      <button mat-icon-button
              (click)="openManageDatabaseDialog()"
              aria-label="Manage databases">
        <mat-icon aria-hidden="true">storage</mat-icon>
      </button>

      <button mat-icon-button
              (click)="openCustomScoreEditor()"
              aria-label="Edit custom scores">
        <mat-icon aria-hidden="true">edit</mat-icon>
      </button>
      <button mat-icon-button
              (click)="themeService.toggle()"
              [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
              [attr.aria-pressed]="themeService.isDark()">
        <mat-icon aria-hidden="true">{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
      <button mat-icon-button
              (click)="keyboardShortcuts.showShortcutsDialog()"
              aria-label="Show keyboard shortcuts">
        <mat-icon aria-hidden="true">keyboard</mat-icon>
      </button>
      @if (!accountService.isLogged) {
        <button mat-icon-button
                (click)="openLoginDialog()"
                aria-label="Login">
          <mat-icon aria-hidden="true">login</mat-icon>
        </button>
      } @else {
        <button mat-icon-button
                (click)="logout()"
                aria-label="Logout">
          <mat-icon aria-hidden="true">logout</mat-icon>
        </button>
      }
      @if (websocket.isReconnecting$ | async) {
        <button mat-icon-button
                class="connection-reconnecting"
                aria-label="Connection status: Reconnecting"
                disabled>
          <mat-icon aria-hidden="true">sync</mat-icon>
        </button>
      } @else if (websocket.connectionStatus$ | async) {
        <button mat-icon-button
                class="connection-connected"
                aria-label="Connection status: Connected"
                disabled>
          <mat-icon aria-hidden="true">cloud_done</mat-icon>
        </button>
      } @else {
        <button mat-icon-button
                class="connection-disconnected"
                (click)="connectWS()"
                aria-label="Connection status: Disconnected. Click to reconnect">
          <mat-icon aria-hidden="true">cloud_off</mat-icon>
        </button>
      }
    </div>
  </mat-toolbar>
  <main id="main-content" tabindex="-1">
    @if (ready) {
      <app-breadcrumb></app-breadcrumb>
      <router-outlet></router-outlet>
    }
  </main>
</mat-drawer-container>

<input type="file" #inputFile hidden (change)="handleFileImport($event)" aria-hidden="true">
